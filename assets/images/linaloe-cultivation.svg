<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: transparent;">
  <defs>
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#4682B4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGradient">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.8" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cielo animado -->
  <rect width="800" height="400" fill="url(#skyGradient)">
    <animate attributeName="fill" values="url(#skyGradient);#87CEEB;url(#skyGradient)" dur="8s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Sol brillante -->
  <circle cx="650" cy="100" r="60" fill="url(#sunGradient)" filter="url(#glow)">
    <animate attributeName="r" values="60;65;60" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Rayos del sol -->
  <g id="sun-rays" opacity="0.6">
    <path d="M 650 100 L 650 40" stroke="#FFD700" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 650 100;360 650 100" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M 650 100 L 700 70" stroke="#FFD700" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 650 100;360 650 100" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M 650 100 L 700 130" stroke="#FFD700" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 650 100;360 650 100" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M 650 100 L 650 160" stroke="#FFD700" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 650 100;360 650 100" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M 650 100 L 600 70" stroke="#FFD700" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 650 100;360 650 100" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M 650 100 L 600 130" stroke="#FFD700" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 650 100;360 650 100" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Montañas lejanas con niebla -->
  <g id="mountains-back" opacity="0.7">
    <path d="M 0 350 L 200 250 L 400 300 L 600 230 L 800 270 L 800 600 L 0 600 Z" 
          fill="url(#mountainGradient)"/>
    <!-- Nieve en las cimas -->
    <path d="M 180 250 L 200 250 L 190 230 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M 580 230 L 600 230 L 590 210 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>
  
  <!-- Montañas cercanas -->
  <g id="mountains-front">
    <path d="M 0 400 L 150 300 L 300 330 L 450 270 L 600 300 L 750 250 L 800 280 L 800 600 L 0 600 Z" 
          fill="url(#mountainGradient)" opacity="0.9"/>
  </g>
  
  <!-- Árboles de Linaloe mejorados y animados -->
  <g id="linaloe-trees">
    <!-- Árbol 1 - con movimiento -->
    <g transform="translate(100, 380)">
      <circle cx="0" cy="0" r="25" fill="url(#treeGradient)">
        <animate attributeName="r" values="25;27;25" dur="3s" repeatCount="indefinite"/>
      </circle>
      <rect x="-8" y="0" width="16" height="40" fill="#8B4513"/>
      <!-- Semillas doradas brillantes -->
      <circle cx="-5" cy="-10" r="8" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="5" cy="-15" r="6" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-5" r="7" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Árbol 2 -->
    <g transform="translate(250, 360)">
      <circle cx="0" cy="0" r="30" fill="url(#treeGradient)">
        <animate attributeName="r" values="30;32;30" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <rect x="-10" y="0" width="20" height="45" fill="#8B4513"/>
      <circle cx="-8" cy="-12" r="10" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="8" cy="-18" r="8" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-5" r="7" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Árbol 3 -->
    <g transform="translate(400, 340)">
      <circle cx="0" cy="0" r="28" fill="url(#treeGradient)">
        <animate attributeName="r" values="28;30;28" dur="4s" repeatCount="indefinite"/>
      </circle>
      <rect x="-9" y="0" width="18" height="42" fill="#8B4513"/>
      <circle cx="-6" cy="-8" r="9" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="6" cy="-12" r="7" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Árbol 4 - el más grande -->
    <g transform="translate(550, 320)">
      <circle cx="0" cy="0" r="32" fill="url(#treeGradient)">
        <animate attributeName="r" values="32;35;32" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <rect x="-12" y="0" width="24" height="48" fill="#8B4513"/>
      <circle cx="-10" cy="-15" r="12" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="10" cy="-20" r="10" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-8" r="8" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Árbol 5 -->
    <g transform="translate(700, 300)">
      <circle cx="0" cy="0" r="26" fill="url(#treeGradient)">
        <animate attributeName="r" values="26;28;26" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="-8" y="0" width="16" height="38" fill="#8B4513"/>
      <circle cx="-5" cy="-10" r="8" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="5" cy="-15" r="6" fill="#D4AF37" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Artesano con animación -->
  <g id="artisan" transform="translate(300, 420)">
    <!-- Cuerpo con movimiento sutil -->
    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#8B4513">
      <animate attributeName="ry" values="25;26;25" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Cabeza -->
    <circle cx="0" cy="-35" r="12" fill="#F4A460"/>
    
    <!-- Brazos animados como si estuviera trabajando -->
    <ellipse cx="-20" cy="-20" rx="8" ry="20" fill="#F4A460" transform="rotate(-30 -20 -20)">
      <animateTransform attributeName="transform" type="rotate" values="-30 -20 -20;-35 -20 -20;-30 -20 -20" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="20" cy="-20" rx="8" ry="20" fill="#F4A460" transform="rotate(30 20 -20)">
      <animateTransform attributeName="transform" type="rotate" values="30 20 -20;35 20 -20;30 20 -20" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Canasta de cosecha brillante -->
    <ellipse cx="30" cy="0" rx="20" ry="15" fill="#DEB887" stroke="#8B4513" stroke-width="2"/>
    <ellipse cx="30" cy="0" rx="15" ry="10" fill="rgba(212, 175, 55, 0.4)"/>
    
    <!-- Semillas en la canasta con brillo -->
    <circle cx="25" cy="-5" r="4" fill="#D4AF37" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="0" r="3" fill="#D4AF37" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="5" r="4" fill="#D4AF37" filter="url(#glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Elementos de sostenibilidad mejorados -->
  <g id="sustainability-elements">
    <!-- Símbolo de reciclaje animado -->
    <g transform="translate(50, 100)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0.8">
        <animate attributeName="r" values="25;27;25" dur="3s" repeatCount="indefinite"/>
      </circle>
      <path d="M -15 -10 L 15 -10 L 15 10 L -15 10 Z" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.8"/>
      <text x="0" y="5" text-anchor="middle" fill="#D4AF37" font-size="12" font-family="Arial" opacity="0.9">♻</text>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="8s" repeatCount="indefinite"/>
    </g>
    
    <!-- Símbolo de hoja animada -->
    <g transform="translate(750, 120)">
      <path d="M 0 -20 Q 10 -10 0 0 Q -10 10 0 20 Q 10 10 0 0 Q -10 -10 0 -20" 
            fill="#32CD32" opacity="0.9">
        <animate attributeName="fill" values="#32CD32;#228B22;#32CD32" dur="4s" repeatCount="indefinite"/>
      </path>
      <text x="0" y="5" text-anchor="middle" fill="#D4AF37" font-size="10" font-family="Arial" opacity="0.9">🌱</text>
    </g>
  </g>
  
  <!-- Nubes animadas y más realistas -->
  <g id="clouds">
    <g transform="translate(150, 80)">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="rgba(255, 255, 255, 0.7)">
        <animate attributeName="rx" values="40;45;40" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="30" cy="0" rx="30" ry="15" fill="rgba(255, 255, 255, 0.7)"/>
      <ellipse cx="60" cy="0" rx="35" ry="18" fill="rgba(255, 255, 255, 0.7)"/>
      <animateTransform attributeName="transform" type="translate" values="150,80;170,80;150,80" dur="8s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(600, 60)">
      <ellipse cx="0" cy="0" rx="35" ry="18" fill="rgba(255, 255, 255, 0.6)">
        <animate attributeName="rx" values="35;40;35" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="30" cy="0" rx="25" ry="12" fill="rgba(255, 255, 255, 0.6)"/>
      <ellipse cx="60" cy="0" rx="30" ry="15" fill="rgba(255, 255, 255, 0.6)"/>
      <animateTransform attributeName="transform" type="translate" values="600,60;580,60;600,60" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Partículas mágicas flotantes -->
  <g id="magic-particles">
    <circle cx="100" cy="250" r="2" fill="#FFD700" opacity="0.8">
      <animate attributeName="cy" values="250;230;250" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="280" r="2" fill="#FFD700" opacity="0.6">
      <animate attributeName="cy" values="280;260;280" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="180" r="1.5" fill="#FFD700" opacity="0.7">
      <animate attributeName="cy" values="180;160;180" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="200" r="1.5" fill="#FFD700" opacity="0.5">
      <animate attributeName="cy" values="200;180;200" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Texto descriptivo mejorado -->
  <text x="400" y="580" text-anchor="middle" fill="#D4AF37" font-size="16" font-family="Georgia, serif" font-weight="bold" filter="url(#softGlow)">
    Cultivo Sostenible en las Montañas de Guerrero
  </text>
  
  <!-- Título -->
  <text x="400" y="40" text-anchor="middle" fill="#D4AF37" font-size="24" font-family="Georgia, serif" font-weight="bold" filter="url(#glow)">
    El Cultivo Sagrado del Linaloe
  </text>
</svg>