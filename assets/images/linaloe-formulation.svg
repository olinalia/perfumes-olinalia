<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: transparent;">
  <defs>
    <linearGradient id="labGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="liquidGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:0.95" />
    </linearGradient>
    <radialGradient id="magicGlow">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.2" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="intenseGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo mágico de laboratorio -->
  <rect width="800" height="600" fill="#1a1a1a"/>
  <rect width="800" height="600" fill="url(#labGradient)" opacity="0.15"/>
  
  <!-- Efecto de spotlight central -->
  <ellipse cx="400" cy="300" rx="350" ry="250" fill="url(#magicGlow)" opacity="0.2"/>
  
  <!-- Mesa de laboratorio mejorada -->
  <rect x="0" y="450" width="800" height="150" fill="url(#labGradient)"/>
  <rect x="0" y="450" width="800" height="15" fill="#D4AF37" opacity="0.4"/>
  
  <!-- Matraz principal con efectos mágicos -->
  <g id="main-flask" transform="translate(400, 320)">
    <!-- Aura mágica -->
    <circle cx="0" cy="0" r="80" fill="#D4AF37" opacity="0.2" filter="url(#intenseGlow)">
      <animate attributeName="r" values="80;85;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Matraz -->
    <ellipse cx="0" cy="0" rx="70" ry="70" fill="#E6E6FA" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="65" ry="65" fill="#F0F0F0" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="#D4AF37" stroke-width="4" filter="url(#glow)">
      <animate attributeName="stroke-width" values="4;6;4" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Mezcla mágica de esencias -->
    <ellipse cx="0" cy="15" rx="55" ry="45" fill="url(#liquidGold)" opacity="0.9">
      <animate attributeName="ry" values="45;48;45" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Efecto de mezcla animado -->
    <circle cx="-15" cy="5" r="12" fill="#32CD32" opacity="0.7" filter="url(#glow)">
      <animate attributeName="cy" values="5;-5;5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="12;15;12" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="8" r="10" fill="#9370DB" opacity="0.6" filter="url(#glow)">
      <animate attributeName="cy" values="8;-2;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="12" r="11" fill="#FF69B4" opacity="0.5" filter="url(#glow)">
      <animate attributeName="cy" values="12;2;12" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cuello del matraz -->
    <rect x="-20" y="-70" width="40" height="30" fill="#F0F0F0"/>
    <ellipse cx="0" cy="-70" rx="20" ry="4" fill="#D4AF37" filter="url(#glow)"/>
    
    <!-- Vapor mágico saliendo -->
    <ellipse cx="0" cy="-80" rx="15" ry="20" fill="#FFFFFF" opacity="0.4">
      <animate attributeName="ry" values="20;35;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Frascos de aceites mágicos en estante -->
  <g id="magic-shelf" transform="translate(0, 100)">
    <rect x="50" y="0" width="700" height="12" fill="#8B4513" filter="url(#glow)"/>
    
    <!-- Frasco 1 - Linaloe brillante -->
    <g transform="translate(100, -40)">
      <circle cx="0" cy="0" r="20" fill="#D4AF37" opacity="0.3" filter="url(#glow)">
        <animate attributeName="r" values="20;25;20" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <rect x="-18" y="0" width="36" height="50" fill="#4169E1" rx="4"/>
      <rect x="-15" y="5" width="30" height="40" fill="#32CD32" opacity="0.8" rx="3"/>
      <ellipse cx="0" cy="0" rx="18" ry="5" fill="#1E90FF"/>
      <text x="0" y="-25" text-anchor="middle" fill="#FFD700" font-size="12" font-family="Georgia" font-weight="bold" filter="url(#glow)">Linaloe</text>
    </g>
    
    <!-- Frasco 2 - Lavanda mágica -->
    <g transform="translate(200, -40)">
      <circle cx="0" cy="0" r="20" fill="#9370DB" opacity="0.3" filter="url(#glow)">
        <animate attributeName="r" values="20;25;20" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <rect x="-18" y="0" width="36" height="50" fill="#9370DB" rx="4"/>
      <rect x="-15" y="5" width="30" height="40" fill="#9370DB" opacity="0.7" rx="3"/>
      <ellipse cx="0" cy="0" rx="18" ry="5" fill="#8A2BE2"/>
      <text x="0" y="-25" text-anchor="middle" fill="#FFD700" font-size="12" font-family="Georgia" font-weight="bold" filter="url(#glow)">Lavanda</text>
    </g>
    
    <!-- Frasco 3 - Sándalo dorado -->
    <g transform="translate(300, -40)">
      <circle cx="0" cy="0" r="20" fill="#DEB887" opacity="0.3" filter="url(#glow)">
        <animate attributeName="r" values="20;25;20" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
      </circle>
      <rect x="-18" y="0" width="36" height="50" fill="#DEB887" rx="4"/>
      <rect x="-15" y="5" width="30" height="40" fill="#DEB887" opacity="0.7" rx="3"/>
      <ellipse cx="0" cy="0" rx="18" ry="5" fill="#D2691E"/>
      <text x="0" y="-25" text-anchor="middle" fill="#FFD700" font-size="12" font-family="Georgia" font-weight="bold" filter="url(#glow)">Sándalo</text>
    </g>
    
    <!-- Frasco 4 - Rosa encantada -->
    <g transform="translate(400, -40)">
      <circle cx="0" cy="0" r="20" fill="#FF69B4" opacity="0.3" filter="url(#glow)">
        <animate attributeName="r" values="20;25;20" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="-18" y="0" width="36" height="50" fill="#FF69B4" rx="4"/>
      <rect x="-15" y="5" width="30" height="40" fill="#FF69B4" opacity="0.7" rx="3"/>
      <ellipse cx="0" cy="0" rx="18" ry="5" fill="#FF1493"/>
      <text x="0" y="-25" text-anchor="middle" fill="#FFD700" font-size="12" font-family="Georgia" font-weight="bold" filter="url(#glow)">Rosa</text>
    </g>
    
    <!-- Frasco 5 - Cítricos brillantes -->
    <g transform="translate(500, -40)">
      <circle cx="0" cy="0" r="20" fill="#FFA500" opacity="0.3" filter="url(#glow)">
        <animate attributeName="r" values="20;25;20" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <rect x="-18" y="0" width="36" height="50" fill="#FFA500" rx="4"/>
      <rect x="-15" y="5" width="30" height="40" fill="#FFA500" opacity="0.7" rx="3"/>
      <ellipse cx="0" cy="0" rx="18" ry="5" fill="#FF8C00"/>
      <text x="0" y="-25" text-anchor="middle" fill="#FFD700" font-size="12" font-family="Georgia" font-weight="bold" filter="url(#glow)">Cítricos</text>
    </g>
    
    <!-- Frasco 6 - Madera mística -->
    <g transform="translate(600, -40)">
      <circle cx="0" cy="0" r="20" fill="#8B4513" opacity="0.3" filter="url(#glow)">
        <animate attributeName="r" values="20;25;20" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="-18" y="0" width="36" height="50" fill="#8B4513" rx="4"/>
      <rect x="-15" y="5" width="30" height="40" fill="#8B4513" opacity="0.7" rx="3"/>
      <ellipse cx="0" cy="0" rx="18" ry="5" fill="#654321"/>
      <text x="0" y="-25" text-anchor="middle" fill="#FFD700" font-size="12" font-family="Georgia" font-weight="bold" filter="url(#glow)">Madera</text>
    </g>
  </g>
  
  <!-- Alquimista mágico -->
  <g id="magic-alchemist" transform="translate(250, 280)">
    <!-- Aura personal -->
    <circle cx="0" cy="-20" r="40" fill="#D4AF37" opacity="0.2" filter="url(#glow)">
      <animate attributeName="r" values="40;45;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cuerpo -->
    <ellipse cx="0" cy="0" rx="22" ry="38" fill="#8B4513">
      <animate attributeName="ry" values="38;39;38" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Cabeza -->
    <circle cx="0" cy="-45" r="18" fill="#F4A460"/>
    
    <!-- Brazos con movimiento mágico -->
    <ellipse cx="-35" cy="-25" rx="12" ry="28" fill="#F4A460" transform="rotate(-60 -35 -25)">
      <animateTransform attributeName="transform" type="rotate" values="-60 -35 -25;-65 -35 -25;-55 -35 -25;-60 -35 -25" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="35" cy="-25" rx="12" ry="28" fill="#F4A460" transform="rotate(60 35 -25)">
      <animateTransform attributeName="transform" type="rotate" values="60 35 -25;65 35 -25;55 35 -25;60 35 -25" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Delantal mágico -->
    <rect x="-18" y="-15" width="36" height="45" fill="#F0F0F0" opacity="0.9" rx="3"/>
    
    <!-- Herramienta mágica en mano -->
    <rect x="30" y="-40" width="4" height="30" fill="#D4AF37" transform="rotate(45 30 -40)" filter="url(#intenseGlow)">
      <animate attributeName="fill" values="#D4AF37;#FFD700;#D4AF37" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Partículas mágicas intensificadas -->
  <g id="intense-magic-particles">
    <circle cx="100" cy="250" r="3" fill="#FFD700" opacity="0.9" filter="url(#glow)">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="280" r="3" fill="#FFD700" opacity="0.8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="180" r="2.5" fill="#FFD700" opacity="0.8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;4;2.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="200" r="2.5" fill="#FFD700" opacity="0.7" filter="url(#glow)">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;4;2.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="120" r="2" fill="#FF69B4" opacity="0.8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3.5;2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Título mágico -->
  <text x="400" y="40" text-anchor="middle" fill="#FFD700" font-size="28" font-family="Georgia, serif" font-weight="bold" filter="url(#intenseGlow)">
    La Alquimia Mágica de la Formulación
  </text>
</svg>
