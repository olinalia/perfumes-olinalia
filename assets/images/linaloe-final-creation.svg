<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: transparent;">
  <defs>
    <linearGradient id="luxuryGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000080;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="spotlight">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="starGlow">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.3" />
    </radialGradient>
    <filter id="intenseGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="superGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo de lujo -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  <rect width="800" height="600" fill="url(#luxuryGradient)" opacity="0.1"/>
  
  <!-- Efectos de spotlight dramáticos -->
  <ellipse cx="400" cy="300" rx="400" ry="300" fill="url(#spotlight)" opacity="0.4"/>
  <ellipse cx="200" cy="200" rx="150" ry="150" fill="url(#spotlight)" opacity="0.2"/>
  <ellipse cx="600" cy="400" rx="150" ry="150" fill="url(#spotlight)" opacity="0.2"/>
  
  <!-- Mesa de presentación de lujo -->
  <rect x="0" y="450" width="800" height="150" fill="url(#boxGradient)"/>
  <rect x="0" y="450" width="800" height="20" fill="url(#luxuryGradient)" opacity="0.6"/>
  
  <!-- Colección de perfumes finales espectacular -->
  <g id="perfume-collection" transform="translate(400, 280)">
    
    <!-- Frasco principal - estrella del show -->
    <g id="main-bottle" transform="translate(0, 0)">
      <!-- Aura de lujo intensa -->
      <circle cx="0" cy="0" r="100" fill="#FFD700" opacity="0.3" filter="url(#superGlow)">
        <animate attributeName="r" values="100;110;100" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Sombra de lujo -->
      <ellipse cx="0" cy="90" rx="45" ry="10" fill="#000000" opacity="0.6"/>
      
      <!-- Caja de lujo mejorada -->
      <rect x="-55" y="25" width="110" height="75" fill="url(#boxGradient)" rx="8"/>
      <rect x="-50" y="30" width="100" height="65" fill="none" stroke="url(#luxuryGradient)" stroke-width="3" rx="5"/>
      <rect x="-45" y="35" width="90" height="55" fill="none" stroke="#D4AF37" stroke-width="1" rx="3" opacity="0.6"/>
      
      <!-- Frasco de perfume espectacular -->
      <rect x="-25" y="-50" width="50" height="75" fill="url(#bottleGradient)" rx="6"/>
      <rect x="-22" y="-45" width="44" height="65" fill="url(#liquidGradient)" opacity="0.8" rx="4"/>
      
      <!-- Tapón de lujo -->
      <rect x="-15" y="-65" width="30" height="20" fill="url(#luxuryGradient)" rx="4"/>
      <ellipse cx="0" cy="-65" rx="15" ry="5" fill="#FFD700" filter="url(#intenseGlow)">
        <animate attributeName="fill" values="#FFD700;#FFFFFF;#FFD700" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      
      <!-- Etiqueta de lujo -->
      <rect x="-18" y="-15" width="36" height="25" fill="#F5E6D3" rx="3"/>
      <rect x="-16" y="-13" width="32" height="21" fill="none" stroke="url(#luxuryGradient)" stroke-width="2" rx="2"/>
      <text x="0" y="0" text-anchor="middle" fill="#654321" font-size="10" font-family="Georgia" font-weight="bold">OLINALIA</text>
      <text x="0" y="8" text-anchor="middle" fill="#D4AF37" font-size="6" font-family="Georgia">PREMIUM</text>
      
      <!-- Efecto de brillo dinámico -->
      <rect x="-20" y="-40" width="4" height="35" fill="#FFFFFF" opacity="0.6" rx="2">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="width" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      </rect>
      
      <!-- Partículas flotantes de lujo -->
      <circle cx="-35" cy="-25" r="3" fill="#FFD700" filter="url(#intenseGlow)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="35" cy="-15" r="2.5" fill="#FFD700" filter="url(#intenseGlow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="2.5;4;2.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-35" r="2" fill="#FFFFFF" filter="url(#intenseGlow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Frasco secundario - izquierda -->
    <g id="second-bottle" transform="translate(-140, 15) scale(0.85)">
      <!-- Aura sutil -->
      <circle cx="0" cy="0" r="60" fill="#D4AF37" opacity="0.2" filter="url(#softGlow)">
        <animate attributeName="r" values="60;65;60" dur="5s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Sombra -->
      <ellipse cx="0" cy="80" rx="35" ry="8" fill="#000000" opacity="0.5"/>
      
      <!-- Caja -->
      <rect x="-45" y="20" width="90" height="60" fill="#8B4513" rx="5"/>
      <rect x="-40" y="25" width="80" height="50" fill="none" stroke="#D4AF37" stroke-width="2" rx="3"/>
      
      <!-- Frasco -->
      <rect x="-20" y="-40" width="40" height="60" fill="#4169E1" rx="4"/>
      <rect x="-17" y="-35" width="34" height="50" fill="url(#liquidGradient)" opacity="0.7" rx="2"/>
      
      <!-- Tapón -->
      <rect x="-12" y="-50" width="24" height="15" fill="#D4AF37" rx="3"/>
      <ellipse cx="0" cy="-50" rx="12" ry="3" fill="#B8860B"/>
      
      <!-- Etiqueta -->
      <rect x="-15" y="-10" width="30" height="20" fill="#F5E6D3" rx="2"/>
      <text x="0" y="0" text-anchor="middle" fill="#654321" font-size="7" font-family="Georgia" font-weight="bold">DAMA</text>
      <text x="0" y="6" text-anchor="middle" fill="#D4AF37" font-size="5" font-family="Georgia">LUJO</text>
      
      <!-- Brillo -->
      <rect x="-15" y="-30" width="2" height="20" fill="#FFFFFF" opacity="0.5" rx="1"/>
    </g>
    
    <!-- Frasco terciario - derecha -->
    <g id="third-bottle" transform="translate(140, 15) scale(0.85)">
      <!-- Aura sutil -->
      <circle cx="0" cy="0" r="60" fill="#D4AF37" opacity="0.2" filter="url(#softGlow)">
        <animate attributeName="r" values="60;65;60" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Sombra -->
      <ellipse cx="0" cy="80" rx="35" ry="8" fill="#000000" opacity="0.5"/>
      
      <!-- Caja -->
      <rect x="-45" y="20" width="90" height="60" fill="#8B4513" rx="5"/>
      <rect x="-40" y="25" width="80" height="50" fill="none" stroke="#D4AF37" stroke-width="2" rx="3"/>
      
      <!-- Frasco -->
      <rect x="-20" y="-40" width="40" height="60" fill="#4169E1" rx="4"/>
      <rect x="-17" y="-35" width="34" height="50" fill="url(#liquidGradient)" opacity="0.7" rx="2"/>
      
      <!-- Tapón -->
      <rect x="-12" y="-50" width="24" height="15" fill="#D4AF37" rx="3"/>
      <ellipse cx="0" cy="-50" rx="12" ry="3" fill="#B8860B"/>
      
      <!-- Etiqueta -->
      <rect x="-15" y="-10" width="30" height="20" fill="#F5E6D3" rx="2"/>
      <text x="0" y="0" text-anchor="middle" fill="#654321" font-size="7" font-family="Georgia" font-weight="bold">CABALLERO</text>
      <text x="0" y="6" text-anchor="middle" fill="#D4AF37" font-size="5" font-family="Georgia">ÉLITE</text>
      
      <!-- Brillo -->
      <rect x="-15" y="-30" width="2" height="20" fill="#FFFFFF" opacity="0.5" rx="1"/>
    </g>
  </g>
  
  <!-- Artesano maestro presentando -->
  <g id="master-artisan" transform="translate(600, 320)">
    <!-- Aura de maestría -->
    <circle cx="0" cy="-40" r="50" fill="#D4AF37" opacity="0.3" filter="url(#intenseGlow)">
      <animate attributeName="r" values="50;55;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cuerpo -->
    <ellipse cx="0" cy="0" rx="20" ry="35" fill="#8B4513">
      <animate attributeName="ry" values="35;36;35" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Cabeza -->
    <circle cx="0" cy="-40" r="16" fill="#F4A460"/>
    
    <!-- Brazos en gesto de presentación -->
    <ellipse cx="-30" cy="-25" rx="10" ry="25" fill="#F4A460" transform="rotate(-45 -30 -25)">
      <animateTransform attributeName="transform" type="rotate" values="-45 -30 -25;-50 -30 -25;-40 -30 -25;-45 -30 -25" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="30" cy="-25" rx="10" ry="25" fill="#F4A460" transform="rotate(30 30 -25)">
      <animateTransform attributeName="transform" type="rotate" values="30 30 -25;35 30 -25;25 30 -25;30 30 -25" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Mano señalando con energía -->
    <circle cx="35" cy="-40" r="10" fill="#F4A460"/>
    <circle cx="35" cy="-40" r="12" fill="#D4AF37" opacity="0.5" filter="url(#glow)">
      <animate attributeName="r" values="12;15;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Expresión de orgullo -->
    <circle cx="-5" cy="-42" r="2" fill="#000000"/>
    <circle cx="5" cy="-42" r="2" fill="#000000"/>
    <path d="M -8 -35 Q 0 -32 8 -35" stroke="#000000" stroke-width="1.5" fill="none"/>
    
    <!-- Delantal de maestro -->
    <rect x="-16" y="-10" width="32" height="40" fill="#F0F0F0" opacity="0.9" rx="3"/>
    <rect x="-14" y="-8" width="28" height="36" fill="none" stroke="#D4AF37" stroke-width="1" rx="2"/>
  </g>
  
  <!-- Elementos de calidad espectaculares -->
  <g id="quality-elements">
    <!-- Sello de calidad dorado -->
    <g transform="translate(100, 150)">
      <circle cx="0" cy="0" r="30" fill="url(#luxuryGradient)" filter="url(#intenseGlow)">
        <animate attributeName="r" values="30;33;30" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#D4AF37" stroke-width="3"/>
      <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Georgia" font-weight="bold">✓</text>
      <text x="0" y="-40" text-anchor="middle" fill="#FFD700" font-size="12" font-family="Georgia" font-weight="bold">ARTESANAL</text>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="20s" repeatCount="indefinite"/>
    </g>
    
    <!-- Certificado de lujo -->
    <g transform="translate(700, 150)">
      <rect x="-40" y="-25" width="80" height="50" fill="#F5E6D3" stroke="url(#luxuryGradient)" stroke-width="3" rx="5" filter="url(#softGlow)"/>
      <text x="0" y="0" text-anchor="middle" fill="#654321" font-size="16" font-family="Georgia" font-weight="bold">100%</text>
      <text x="0" y="12" text-anchor="middle" fill="#D4AF37" font-size="10" font-family="Georgia">NATURAL</text>
      <text x="0" y="-35" text-anchor="middle" fill="#FFD700" font-size="12" font-family="Georgia" font-weight="bold">PREMIUM</text>
    </g>
    
    <!-- Estrella de calidad masiva -->
    <g transform="translate(400, 100)">
      <path d="M 0,-25 L 8,-8 L 25,-5 L 12,8 L 15,25 L 0,15 L -15,25 L -12,8 L -25,-5 L -8,-8 Z" 
            fill="url(#starGlow)" filter="url(#superGlow)">
        <animateTransform attributeName="transform" type="rotate" values="0;360;0" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="url(#starGlow);#FFD700;url(#starGlow)" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M 0,-20 L 6,-6 L 20,-4 L 10,6 L 12,20 L 0,12 L -12,20 L -10,6 L -20,-4 L -6,-6 Z" 
            fill="#FFD700" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0;-360;0" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- Rayos de luz dramáticos -->
  <g id="dramatic-rays" opacity="0.5">
    <path d="M 400 50 L 350 250" stroke="#FFD700" stroke-width="3" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 400 50 L 450 250" stroke="#FFD700" stroke-width="3" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" begin="0.5s"/>
    </path>
    <path d="M 400 50 L 400 270" stroke="#FFD700" stroke-width="3" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" begin="1s"/>
    </path>
    <path d="M 400 50 L 300 200" stroke="#FFD700" stroke-width="2" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" begin="1.5s"/>
    </path>
    <path d="M 400 50 L 500 200" stroke="#FFD700" stroke-width="2" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" begin="2s"/>
    </path>
  </g>
  
  <!-- Partículas de celebración espectaculares -->
  <g id="celebration-particles">
    <circle cx="150" cy="200" r="4" fill="#FFD700" filter="url(#intenseGlow)">
      <animate attributeName="cy" values="200;170;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="220" r="3.5" fill="#FFD700" filter="url(#intenseGlow)">
      <animate attributeName="cy" values="220;190;220" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;5.5;3.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="180" r="3" fill="#FFD700" filter="url(#intenseGlow)">
      <animate attributeName="cy" values="180;150;180" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="190" r="3" fill="#FFD700" filter="url(#intenseGlow)">
      <animate attributeName="cy" values="190;160;190" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="160" r="2.5" fill="#FFFFFF" filter="url(#intenseGlow)">
      <animate attributeName="cy" values="160;130;160" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="170" r="2.5" fill="#FFFFFF" filter="url(#intenseGlow)">
      <animate attributeName="cy" values="170;140;170" dur="2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Texto descriptivo espectacular -->
  <text x="400" y="540" text-anchor="middle" fill="#FFD700" font-size="18" font-family="Georgia, serif" font-weight="bold" font-style="italic" filter="url(#intenseGlow)">
    La Creación Final: Esencia Divina de México
  </text>
  
  <!-- Título espectacular -->
  <text x="400" y="30" text-anchor="middle" fill="#FFD700" font-size="32" font-family="Georgia, serif" font-weight="bold" filter="url(#superGlow)">
    La Creación Final Obra Maestra
  </text>
</svg>
